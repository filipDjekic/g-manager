name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  contract:
    name: CI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/g-manager/package-lock.json
      - run: npm ci
        working-directory: frontend/g-manager
      - run: npm run ci:validate
        working-directory: frontend/g-manager
      - run: npm run ci:validate:self-test
        working-directory: frontend/g-manager

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify backend, static checks, coverage and SBOM
        run: ./mvnw clean verify
        working-directory: gm
      - name: Backend job summary
        if: always()
        run: echo 'Backend Surefire, JaCoCo, Checkstyle and CycloneDX completed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-reports-${{ github.sha }}
          path: |
            gm/target/surefire-reports/
            gm/target/site/jacoco/
            gm/target/checkstyle-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload versioned backend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gm-backend-${{ github.sha }}
          path: |
            gm/target/gm-*.jar
            gm/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30

  mysql:
    name: MySQL migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify migrations and MySQL concurrency
        run: ./mvnw verify -Pmysql-it
        working-directory: gm
      - name: Upload MySQL reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-reports-${{ github.sha }}
          path: gm/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/g-manager/package-lock.json
      - run: npm ci
        working-directory: frontend/g-manager
      - run: npm run test:coverage
        working-directory: frontend/g-manager
      - run: npm run lint
        working-directory: frontend/g-manager
      - run: npm run typecheck
        working-directory: frontend/g-manager
      - run: npm run build
        working-directory: frontend/g-manager
      - run: npm run sbom
        working-directory: frontend/g-manager
      - name: Frontend job summary
        if: always()
        run: echo 'Vitest coverage, ESLint, TypeScript and Vite build completed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-reports-${{ github.sha }}
          path: frontend/g-manager/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload versioned frontend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gm-frontend-${{ github.sha }}
          path: |
            frontend/g-manager/dist/
            frontend/g-manager/bom.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/g-manager/package-lock.json
      - run: npm ci
        working-directory: frontend/g-manager
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/g-manager
      - run: npm run test:e2e
        working-directory: frontend/g-manager
      - name: E2E job summary
        if: always()
        run: echo 'Playwright desktop/mobile role, critical-flow and axe suite completed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-${{ github.sha }}
          path: |
            frontend/g-manager/test-results/
            frontend/g-manager/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: java-kotlin,javascript-typescript
      - uses: github/codeql-action/autobuild@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
      - uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-security:
    name: Filesystem security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
