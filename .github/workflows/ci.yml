name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22.23.3'
  NPM_VERSION: '11.19.1'

jobs:
  gaming-client:
    name: Gaming Client quality and dependency policy
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore GManager.Client.slnx
        working-directory: client
      - run: dotnet build GManager.Client.slnx -c Release --no-restore -warnaserror
        working-directory: client
      - run: dotnet test GManager.Client.slnx -c Release --no-build
        working-directory: client
      - name: Windows enforcement and recovery contracts (isolated OS calls)
        shell: powershell
        working-directory: client
        run: |
          & .\tests\windows-enforcement.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject vulnerable NuGet packages
        shell: pwsh
        run: |
          $json = dotnet list GManager.Client.slnx package --vulnerable --include-transitive --format json --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability query failed.' }
          $report = ($json -join "`n") | ConvertFrom-Json
          $findings = foreach ($project in $report.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package -and $package.vulnerabilities) {
                  "$($project.path): $($package.id) $($package.resolvedVersion)"
                }
              }
            }
          }
          if ($findings) { $findings | Write-Error; throw 'Vulnerable NuGet packages found.' }
          Write-Host 'No vulnerable NuGet packages found.'
        working-directory: client

  contract:
    name: CI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/g-manager/package-lock.json
      - name: Use the same npm version as the frontend image
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
        working-directory: frontend/g-manager
      - run: npm run ci:validate
        working-directory: frontend/g-manager
      - run: npm run ci:validate:self-test
        working-directory: frontend/g-manager

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify backend, static checks, coverage and SBOM
        run: ./mvnw clean verify
        working-directory: gm
      - name: Backend job summary
        if: always()
        run: |
          echo 'Backend verification status: ${{ job.status }}.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-reports-${{ github.sha }}
          path: |
            gm/target/surefire-reports/
            gm/target/site/jacoco/
            gm/target/checkstyle-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload versioned backend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gm-backend-${{ github.sha }}
          path: |
            gm/target/gm-*.jar
            gm/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30

  mysql:
    name: MySQL migration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify migrations and MySQL concurrency
        run: ./mvnw verify -Pmysql-it
        working-directory: gm
      - name: Backup safety contracts without database access
        run: |
          docker build -t gmanager-backup-safety ops/backup
          docker run --rm --mount "type=bind,source=$PWD/ops/backup/test-safety.sh,target=/tmp/test-safety.sh,readonly" gmanager-backup-safety bash /tmp/test-safety.sh
      - name: Upload MySQL reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mysql-reports-${{ github.sha }}
          path: |
            gm/target/failsafe-reports/
            gm/target/backend-performance-*.json
            gm/target/backend-api-inventory.json
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/g-manager/package-lock.json
      - name: Use the same npm version as the frontend image
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
        working-directory: frontend/g-manager
      - run: npm run test:coverage
        working-directory: frontend/g-manager
      - run: npm run lint
        working-directory: frontend/g-manager
      - run: npm run typecheck
        working-directory: frontend/g-manager
      - run: npm run build:budget
        working-directory: frontend/g-manager
      - run: npm run sbom
        working-directory: frontend/g-manager
      - name: Frontend job summary
        if: always()
        run: |
          echo 'Frontend verification status: ${{ job.status }}.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-reports-${{ github.sha }}
          path: frontend/g-manager/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload versioned frontend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gm-frontend-${{ github.sha }}
          path: |
            frontend/g-manager/dist/
            frontend/g-manager/bom.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/g-manager/package-lock.json
      - name: Use the same npm version as the frontend image
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
        working-directory: frontend/g-manager
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/g-manager
      - run: npm run test:e2e
        working-directory: frontend/g-manager
      - run: npm run test:e2e:pwa
        working-directory: frontend/g-manager
      - name: E2E job summary
        if: always()
        run: |
          echo 'Browser E2E verification status: ${{ job.status }}.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-${{ github.sha }}
          path: |
            frontend/g-manager/test-results/
            frontend/g-manager/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use the same npm version as the frontend image
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Audit complete npm dependency lockfile
        run: npm audit --audit-level=high --package-lock-only
        working-directory: frontend/g-manager
      - name: Reject vulnerable backend and client dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin,javascript-typescript
      - name: Compile Java for CodeQL with JDK 21
        run: ./mvnw -B -DskipTests compile
        working-directory: gm
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          output: codeql-results
          upload: never
      - name: Test the CodeQL SARIF gate
        run: python3 -B -m unittest discover -s scripts -p 'test_check_codeql_sarif.py'
      - name: Reject error-level CodeQL findings
        run: python3 -B scripts/check_codeql_sarif.py codeql-results
      - name: Preserve CodeQL SARIF reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-results-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-security:
    name: Filesystem security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
