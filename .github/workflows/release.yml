name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Numeric client release version (for example 1.2.3)
        required: true
        type: string
      environment:
        description: Protected deployment environment
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: release-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Release quality gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
      pull-requests: read

  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Require configured approval protection before signing or deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ENV: ${{ inputs.environment || 'production' }}
        run: python3 ops/deploy/check_release_policy.py client-signing "$DEPLOY_ENV"
      - name: Require an approved default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || { echo '::error::Release commit must be on the approved default branch.'; exit 1; }
      - id: version
        name: Normalize and validate release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo '::error::Release version must be numeric (major.minor.patch[.revision]).'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gaming-client:
    name: Signed Windows Gaming Client
    needs: [prepare, quality]
    runs-on: windows-2025
    environment: client-signing
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      signing-subject: ${{ steps.package.outputs.signing-subject }}
      signing-thumbprint: ${{ steps.package.outputs.signing-thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: '10.0.x' }
      - name: Import ephemeral code-signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.GAMING_CLIENT_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.GAMING_CLIENT_SIGNING_PFX_PASSWORD }}
        run: |
          if (!$env:SIGNING_PFX_BASE64 -or !$env:SIGNING_PFX_PASSWORD) { throw 'GAMING_CLIENT_SIGNING_PFX_BASE64 and GAMING_CLIENT_SIGNING_PFX_PASSWORD are required.' }
          $bytes=[Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          $certificate=New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($bytes,$env:SIGNING_PFX_PASSWORD,'PersistKeySet')
          $store=New-Object System.Security.Cryptography.X509Certificates.X509Store('My','CurrentUser');$store.Open('ReadWrite');$store.Add($certificate);$store.Close()
          "SIGNING_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Publish, Authenticode sign and package
        working-directory: client/packaging
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./publish.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT -Version $env:RELEASE_VERSION
      - id: package
        name: Record signed package identity
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $manifest = Get-Content client/artifacts/GManager.Client.manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:RELEASE_VERSION) { throw 'Signed package version does not match release version.' }
          "sha256=$($manifest.sha256)" >> $env:GITHUB_OUTPUT
          "signing-subject=$($manifest.signingSubject)" >> $env:GITHUB_OUTPUT
          "signing-thumbprint=$($manifest.signingThumbprint)" >> $env:GITHUB_OUTPUT
          . client/packaging/client-management.ps1
          $verify=Join-Path $env:RUNNER_TEMP 'signed-client-verification'
          Expand-ClientPackage client/artifacts/GManager.Client.zip $verify
          [void](Assert-Package $verify $manifest.signingSubject $manifest.signingThumbprint)
      - name: Upload signed client candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gmanager-client-signed
          path: |
            client/artifacts/GManager.Client.zip
            client/artifacts/GManager.Client.manifest.json
            client/artifacts/GManager.Client.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Delete ephemeral signing certificate and private key
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -DeleteKey -Force -ErrorAction SilentlyContinue }

  images:
    name: Build, SBOM and image policy
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Resolve lowercase GHCR namespace
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and publish immutable images with provenance and SBOM
        run: |
          docker buildx build gm --file gm/Dockerfile --build-arg APP_VERSION="$GITHUB_SHA" --tag "$REGISTRY/gmanager-backend:$GITHUB_SHA" --provenance=mode=max --sbom=true --metadata-file "$RUNNER_TEMP/backend-image.json" --push
          docker buildx build frontend/g-manager --file frontend/g-manager/Dockerfile --build-arg APP_VERSION="$GITHUB_SHA" --tag "$REGISTRY/gmanager-frontend:$GITHUB_SHA" --provenance=mode=max --sbom=true --metadata-file "$RUNNER_TEMP/frontend-image.json" --push
      - id: images
        name: Resolve registry digests
        run: |
          backend_digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/backend-image.json")
          frontend_digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/frontend-image.json")
          [[ "$backend_digest" == sha256:* && "$frontend_digest" == sha256:* ]] || { echo '::error::Buildx did not return immutable image digests.'; exit 1; }
          echo "backend=$REGISTRY/gmanager-backend@$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend=$REGISTRY/gmanager-frontend@$frontend_digest" >> "$GITHUB_OUTPUT"
      - name: Reject unapproved high or critical image vulnerabilities
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL --exit-code 1 '${{ steps.images.outputs.backend }}'
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL --exit-code 1 '${{ steps.images.outputs.frontend }}'

  deploy:
    name: Deploy and prove rollback
    needs: [quality, prepare, gaming-client, images]
    runs-on: [self-hosted, gmanager-deploy]
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
      FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
      APP_RELEASE: ${{ github.sha }}
      DEPLOY_ENV: ${{ inputs.environment || 'production' }}
      CANONICAL_ORIGIN: ${{ vars.CANONICAL_ORIGIN }}
      DOCUMENT_STORAGE_BACKEND: ${{ vars.DOCUMENT_STORAGE_BACKEND || 'local' }}
      DOCUMENT_S3_ENDPOINT: ${{ vars.DOCUMENT_S3_ENDPOINT }}
      DOCUMENT_S3_REGION: ${{ vars.DOCUMENT_S3_REGION }}
      DOCUMENT_S3_BUCKET: ${{ vars.DOCUMENT_S3_BUCKET }}
      DEPLOY_STATE_DIR: ${{ vars.DEPLOY_STATE_DIR }}
      DEPLOY_SECRETS_DIR: ${{ vars.DEPLOY_SECRETS_DIR }}
      CLIENT_RELEASES_DIR: ${{ vars.CLIENT_RELEASES_DIR }}
      INITIAL_OWNER_EMAIL: ${{ vars.INITIAL_OWNER_EMAIL }}
      INITIAL_OWNER_NAME: ${{ vars.INITIAL_OWNER_NAME }}
      ENABLE_TLS: ${{ vars.ENABLE_TLS || 'true' }}
      ENABLE_MONITORING: ${{ vars.ENABLE_MONITORING || 'true' }}
      RESTIC_REPOSITORY: ${{ vars.RESTIC_REPOSITORY }}
      BACKUP_INTERVAL_SECONDS: ${{ vars.BACKUP_INTERVAL_SECONDS || '86400' }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
      STATION_POLICY_SIGNING_PUBLIC_KEY: ${{ vars.STATION_POLICY_SIGNING_PUBLIC_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      NOTIFICATION_EMAIL_ENABLED: ${{ vars.NOTIFICATION_EMAIL_ENABLED || 'false' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      STATION_POLICY_SIGNING_KEY_ID: ${{ vars.STATION_POLICY_SIGNING_KEY_ID }}
      GAMING_CLIENT_VERSION: ${{ needs.prepare.outputs.version }}
      GAMING_CLIENT_MINIMUM_VERSION: ${{ vars.GAMING_CLIENT_MINIMUM_VERSION }}
      GAMING_CLIENT_DOWNLOAD_URL: ${{ vars.CANONICAL_ORIGIN }}/downloads/gmanager-client/${{ needs.prepare.outputs.version }}/GManager.Client.zip
      GAMING_CLIENT_SHA256: ${{ needs.gaming-client.outputs.sha256 }}
      GAMING_CLIENT_PACKAGE_SIGNING_SUBJECT: ${{ needs.gaming-client.outputs.signing-subject }}
      GAMING_CLIENT_PACKAGE_SIGNING_THUMBPRINT: ${{ needs.gaming-client.outputs.signing-thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish immutable Client candidate on the protected distribution host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$CLIENT_RELEASES_DIR" && test -n "$DEPLOY_SECRETS_DIR"
          [[ "$CLIENT_RELEASES_DIR" = /* && "$DEPLOY_SECRETS_DIR" = /* ]]
          [[ "$DEPLOY_SECRETS_DIR/" != "$GITHUB_WORKSPACE/"* ]] || { echo '::error::Secrets must remain outside the checkout.'; exit 1; }
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gmanager-client-signed --dir "$RUNNER_TEMP/client-candidate"
          python3 ops/deploy/publish_client.py "$RUNNER_TEMP/client-candidate" "$CLIENT_RELEASES_DIR"
      - name: Provision protected persistent host secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.DOCUMENT_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.DOCUMENT_S3_SECRET_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          STATION_POLICY_SIGNING_PRIVATE_KEY: ${{ secrets.STATION_POLICY_SIGNING_PRIVATE_KEY }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
          INITIAL_OWNER_PASSWORD: ${{ secrets.INITIAL_OWNER_PASSWORD }}
          BACKUP_COORDINATION_KEY: ${{ secrets.BACKUP_COORDINATION_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTORE_VERIFIER_PASSWORD: ${{ secrets.RESTORE_VERIFIER_PASSWORD }}
          RESTIC_ACCESS_KEY_ID: ${{ secrets.RESTIC_ACCESS_KEY_ID }}
          RESTIC_SECRET_ACCESS_KEY: ${{ secrets.RESTIC_SECRET_ACCESS_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python3 ops/deploy/provision_secrets.py
      - name: Deploy through migration, restore and smoke gates
        run: bash ops/deploy/deploy.sh
      - name: Staging rollback rehearsal and candidate redeploy
        if: env.DEPLOY_ENV == 'staging'
        run: |
          if test -f "$DEPLOY_STATE_DIR/previous.json"; then
            bash ops/deploy/rollback.sh
            bash ops/deploy/deploy.sh
          else
            echo 'Initial staging release: rollback rehearsal remains required before production approval.'
          fi
      - name: Staging load smoke
        if: env.DEPLOY_ENV == 'staging'
        env:
          BASE_URL: ${{ vars.CANONICAL_ORIGIN }}
          CUSTOMER_EMAIL: ${{ secrets.SMOKE_CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.SMOKE_CUSTOMER_PASSWORD }}
          MANAGER_EMAIL: ${{ secrets.SMOKE_MANAGER_EMAIL }}
          MANAGER_PASSWORD: ${{ secrets.SMOKE_MANAGER_PASSWORD }}
        run: docker run --rm -v "$PWD/performance/k6:/scripts:ro" -e BASE_URL -e CUSTOMER_EMAIL -e CUSTOMER_PASSWORD -e MANAGER_EMAIL -e MANAGER_PASSWORD grafana/k6:0.57.0 run /scripts/critical-flows.js
      - name: Passive DAST baseline
        if: env.DEPLOY_ENV == 'staging'
        run: docker run --rm zaproxy/zap-stable:2.16.1 zap-baseline.py -t "$CANONICAL_ORIGIN" -m 3
      - name: Verify published Client URL and exact bytes
        run: |
          file=$(mktemp)
          trap 'rm -f -- "$file"' EXIT
          http_status=$(curl --fail --silent --show-error --proto '=https' --max-time 180 --write-out '%{http_code}' "$GAMING_CLIENT_DOWNLOAD_URL" -o "$file")
          test "$http_status" = 200
          printf '%s  %s\n' "$GAMING_CLIENT_SHA256" "$file" | sha256sum --check --status
