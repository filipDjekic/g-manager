server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gmanager_dev
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_64_CHARS_MINIMUM_FOR_DEV_ONLY_123456789"
    expiration-ms: 86400000
