services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gmanager
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - gmanager_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./gm
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_DEVELOPMENT_STATION_IDS: ${DEVELOPMENT_STATION_IDS:-}
      DB_URL: jdbc:mysql://mysql:3306/gmanager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      STATION_POLICY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/local_station_policy_signing_private_key
      STATION_POLICY_SIGNING_KEY_ID: local-development-ed25519-v2
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://192.168.0.8:5173
      CANONICAL_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-Europe/Belgrade}
      UPLOAD_ROOT: /data/uploads
      CANCELLATION_CUTOFF_MINUTES: ${CANCELLATION_CUTOFF_MINUTES:-60}
      INITIAL_OWNER_NAME: ${INITIAL_OWNER_NAME:-Initial Owner}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:-}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-}
      GAMING_CLIENT_VERSION: ${GAMING_CLIENT_VERSION:-0.1.0-dev}
      GAMING_CLIENT_STATUS: ${GAMING_CLIENT_STATUS:-DEVELOPMENT}
      GAMING_CLIENT_DOWNLOAD_URL: ${GAMING_CLIENT_DOWNLOAD_URL:-/downloads/gmanager-client/GManager.Client.zip}
      GAMING_CLIENT_SHA256: ${GAMING_CLIENT_SHA256:-UNPUBLISHED}
      GAMING_CLIENT_MINIMUM_VERSION: ${GAMING_CLIENT_MINIMUM_VERSION:-0.1.0}
      GAMING_CLIENT_PACKAGE_SIGNING_SUBJECT: ${GAMING_CLIENT_PACKAGE_SIGNING_SUBJECT:-UNPUBLISHED}
    ports:
      - "8080:8080"
    volumes:
      - gmanager_uploads:/data/uploads
      - ./gm/config/local/station-policy-signing-private-key.base64:/run/secrets/local_station_policy_signing_private_key:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # The local profile exposes infrastructure readiness on the API port.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: ./frontend/g-manager
    restart: unless-stopped
    ports:
      - "5173:8080"
    volumes:
      - ./client/artifacts:/usr/share/nginx/html/downloads/gmanager-client:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  gmanager_mysql:
  gmanager_uploads:
