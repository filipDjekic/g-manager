# The production listener is loopback-only or behind the private TLS edge.
map $http_x_forwarded_proto $gmanager_forwarded_proto {
  default $scheme;
  https https;
  http http;
}
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location ^~ /internal { return 404; }
  location ^~ /actuator { return 404; }
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  location = /downloads/gmanager-client/GManager.Client.zip {
    types { application/zip zip; }
    default_type application/zip;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'attachment; filename="GManager.Client.zip"';
    try_files $uri =404;
  }
  location = /downloads/gmanager-client/GManager.Client.manifest.json {
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'attachment; filename="GManager.Client.manifest.json"';
    try_files $uri =404;
  }
  location ~ ^/downloads/gmanager-client/[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?/GManager\.Client\.(zip|manifest\.json|zip\.sha256)$ {
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  # Other artifact files and missing packages must never enter the SPA fallback.
  location /downloads/gmanager-client/ { return 404; }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $gmanager_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    error_page 502 503 504 =503 /maintenance.html;
  }
  location ~ ^/api/v1/(notifications|gaming-sessions)/stream$ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $gmanager_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1900s;
  }
  location /media/ { proxy_pass http://backend:8080; proxy_set_header X-Forwarded-Proto $gmanager_forwarded_proto; }
  location / { try_files $uri $uri/ /index.html; }
  location = /maintenance.html { internal; }
}
