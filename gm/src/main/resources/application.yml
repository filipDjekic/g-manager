spring:
  application:
    name: gm
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gmanager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:gmanager}
    password: ${DB_PASSWORD:gmanager}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta:
        persistence:
          query:
            timeout: 5000
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,outbox,backgroundJobs
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        gmanager.http.requests: true

app:
  features:
    reports:
      enabled: ${FEATURE_REPORTS_ENABLED:true}
    workflows:
      enabled: ${FEATURE_WORKFLOWS_ENABLED:true}
    pwa-offline:
      enabled: ${FEATURE_PWA_OFFLINE_ENABLED:true}
    ai-assistant:
      enabled: ${FEATURE_AI_ASSISTANT_ENABLED:false}
  business-zone: ${BUSINESS_TIME_ZONE:Europe/Belgrade}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    local-root: ${UPLOAD_ROOT:data/uploads}
  documents:
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:5242880}
    max-files-per-resource: ${DOCUMENT_MAX_FILES_PER_RESOURCE:20}
    delete-retention-days: ${DOCUMENT_DELETE_RETENTION_DAYS:30}
    backend: ${DOCUMENT_STORAGE_BACKEND:local}
    s3-endpoint: ${DOCUMENT_S3_ENDPOINT:}
    s3-region: ${DOCUMENT_S3_REGION:us-east-1}
    s3-bucket: ${DOCUMENT_S3_BUCKET:}
    s3-access-key: ${DOCUMENT_S3_ACCESS_KEY:}
    s3-secret-key: ${DOCUMENT_S3_SECRET_KEY:}
  idempotency:
    ttl-hours: 24
    cleanup-cron: "0 0 3 * * *"
    in-progress-timeout-seconds: 120
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval-millis: ${OUTBOX_POLL_INTERVAL_MILLIS:1000}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff-seconds: ${OUTBOX_INITIAL_BACKOFF_SECONDS:5}
    retention-days: ${OUTBOX_RETENTION_DAYS:30}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    worker-count: ${JOBS_WORKER_COUNT:4}
    queue-capacity: ${JOBS_QUEUE_CAPACITY:20}
    claim-batch-size: ${JOBS_CLAIM_BATCH_SIZE:4}
    poll-interval-millis: ${JOBS_POLL_INTERVAL_MILLIS:1000}
    lease-seconds: ${JOBS_LEASE_SECONDS:60}
    timeout-seconds: ${JOBS_TIMEOUT_SECONDS:300}
    max-attempts: ${JOBS_MAX_ATTEMPTS:5}
    initial-backoff-seconds: ${JOBS_INITIAL_BACKOFF_SECONDS:10}
    shutdown-wait-seconds: ${JOBS_SHUTDOWN_WAIT_SECONDS:30}
    refresh-token-retention-days: ${REFRESH_TOKEN_RETENTION_DAYS:30}
    audit-retention-days: ${AUDIT_RETENTION_DAYS:365}
  reservations:
    cancellation-cutoff-minutes: ${CANCELLATION_CUTOFF_MINUTES:60}
  notifications:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    delivery-batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE:25}
    max-delivery-attempts: ${NOTIFICATION_MAX_DELIVERY_ATTEMPTS:5}
    initial-backoff-seconds: ${NOTIFICATION_INITIAL_BACKOFF_SECONDS:10}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    sse-timeout-seconds: ${NOTIFICATION_SSE_TIMEOUT_SECONDS:1800}
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 14
    secure-cookie: ${COOKIE_SECURE:true}
  initial-owner:
    name: ${INITIAL_OWNER_NAME:Initial Owner}
    email: ${INITIAL_OWNER_EMAIL:}
    password: ${INITIAL_OWNER_PASSWORD:}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: WARN
