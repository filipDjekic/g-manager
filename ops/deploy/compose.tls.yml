services:
  tls:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Public DNS host required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    networks: [edge]
    depends_on: { frontend: { condition: service_healthy } }
    security_opt: [no-new-privileges:true]
volumes:
  tls_data: {}
  tls_config: {}
