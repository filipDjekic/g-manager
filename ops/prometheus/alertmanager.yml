global:
  resolve_timeout: 5m
route:
  receiver: operations
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operations
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, job]
