groups:
  - name: g-manager
    rules:
      - alert: GManagerInstanceDown
        expr: up{job="g-manager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: G-Manager metrics target is unavailable
          runbook_url: https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt
      - alert: GManagerHighServerErrorRate
        expr: sum(rate(gmanager_http_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) / clamp_min(sum(rate(gmanager_http_requests_seconds_count[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: G-Manager server error rate exceeds five percent
          runbook_url: https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt
      - alert: GManagerOutboxDeadLetter
        expr: gmanager_outbox_dead > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Transactional outbox contains dead events
          runbook_url: https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt
      - alert: GManagerBackgroundJobDead
        expr: gmanager_jobs_dead > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Background job queue contains dead jobs
          runbook_url: https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt
      - alert: GManagerMachineCommandLag
        expr: gmanager_machine_commands_oldest_lag_seconds > 60
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Gaming Client command acknowledgement is delayed", runbook_url: "https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt" }
      - alert: GManagerMachineStationOffline
        expr: gmanager_machine_stations_offline > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "One or more managed gaming stations are offline", runbook_url: "https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt" }
      - alert: GManagerMachineLockPending
        expr: gmanager_machine_stations_lock_pending > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "A gaming station has not acknowledged local lock", runbook_url: "https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt" }
      - alert: GManagerExpiredSessionUnacknowledged
        expr: gmanager_machine_sessions_expired_unacknowledged > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "An expired session is not safely locked", runbook_url: "https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt" }
      - alert: GManagerMachineEnrollmentFailures
        expr: increase(gmanager_machine_enrollment_failures_total[10m]) >= 5
        labels: { severity: warning }
        annotations: { summary: "Repeated Gaming Client enrollment failures", runbook_url: "https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt" }
      - alert: GManagerMachineAuthenticationFailures
        expr: increase(gmanager_machine_authentication_failures_total[10m]) >= 20
        labels: { severity: warning }
        annotations: { summary: "Repeated machine authentication failures", runbook_url: "https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt" }
      - alert: GManagerObservabilityTest
        expr: gmanager_alert_delivery_test == 1
        for: 0m
        labels: { severity: test }
        annotations: { summary: "Synthetic alert validating the alert delivery path" }
      - alert: GManagerGamingLedgerInconsistent
        expr: gmanager_gaming_ledger_violations > 0
        for: 0m
        labels: { severity: critical }
        annotations: { summary: "Financial ledger requires operator investigation; do not rewrite ledger rows" }
      - alert: GManagerFinancialRequestFailed
        expr: sum(increase(gmanager_http_requests_seconds_count{method="POST",route=~"/api/v1/gaming-billing/.*|/api/v1/gaming-sessions.*",outcome="SERVER_ERROR"}[5m])) > 0
        for: 0m
        labels: { severity: critical }
        annotations: { summary: "A financial/session request failed; reconcile using the same idempotency key" }
      - alert: GManagerClientRecoveryFailed
        expr: gmanager_machine_clients_failed > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "A Gaming Client reports an enforcement or recovery error" }
      - alert: GManagerClientUpdateFailed
        expr: gmanager_machine_updates_failed > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "A Gaming Client reports a failed update" }
      - alert: GManagerDatabaseUnavailable
        expr: hikaricp_connections_timeout_total > 0 and increase(hikaricp_connections_timeout_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Database connection pool cannot serve requests
          runbook_url: https://github.com/filipDjekic/g-manager/blob/main/ops/runbooks/observability.txt

      - alert: GManagerFrontendDown
        expr: probe_success{job="frontend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Frontend health probe failed" }
      - alert: GManagerBackupFailed
        expr: gmanager_backup_failed > 0 and gmanager_backup_expected == 1
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Scheduled database/document backup failed; inspect protected backup status" }
      - alert: GManagerBackupStale
        expr: (time() - gmanager_backup_last_success > gmanager_backup_max_age) and gmanager_backup_expected == 1
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "No recent successful coordinated backup" }
      - alert: GManagerOffsiteBackupStale
        expr: (time() - gmanager_backup_last_offsite > gmanager_backup_max_age) and gmanager_backup_expected == 1
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Off-site backup is missing or stale" }
      - alert: GManagerRestoreDrillStale
        expr: (time() - gmanager_backup_last_restore > gmanager_backup_restore_max_age) and gmanager_backup_expected == 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Scheduled off-site restore drill is overdue" }
      - alert: GManagerAlertDeliveryFailed
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Alert delivery is failing; check the configured receiver and host monitoring" }
      - alert: GManagerDocumentScannerUnavailable
        expr: increase(gmanager_document_scan_total{result="error"}[5m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Document scanning failed; files remain quarantined and transport outages retry after backoff" }
      - alert: GManagerBackendNotReady
        expr: probe_success{job="backend-readiness"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Backend readiness or MySQL connectivity failed; metrics availability alone is insufficient" }
