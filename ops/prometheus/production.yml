global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: g-manager
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["backend:9091"] }]
  - job_name: frontend
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: ["http://frontend:8080/healthz"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
  - job_name: backend-readiness
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: ["http://backend:9091/actuator/health/readiness"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
